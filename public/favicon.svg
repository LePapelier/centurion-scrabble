<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Le C est tracé, non composé : une lettre en <text> dépendrait de la
       police du système, dont la largeur varie d'un appareil à l'autre. La
       version précédente n'avait d'ailleurs pas d'ancrage, si bien que le C
       partait du milieu vers la droite et débordait du cadre. -->
  <rect width="64" height="64" rx="13" fill="#15301f" />
  <rect x="7" y="7" width="50" height="50" rx="8" fill="#f0e2c4" />
  <path d="M43 22 A15 15 0 1 0 43 42" fill="none" stroke="#2a2118" stroke-width="9.5" stroke-linecap="round" />
</svg>
