<?xml version="1.0" encoding="UTF-8"?>
<!--
  Décor du thème Verre.

  L'esthétique visée est celle du milieu des années 2000 : du verre, de l'eau,
  du ciel, de l'herbe très verte et des objets vernis. Tout est dessiné plutôt
  que photographié, parce que le réseau de cette machine ne sort que vers les
  dépôts de paquets — mais aussi parce qu'un vectoriel reste net sur tous les
  écrans et tient en quelques kilo-octets.

  Le cadrage est en "slice", donc le rognage dépend de la forme de l'écran, et
  les deux écrans ne voient pas la même chose. Un téléphone garde toute la
  hauteur et perd les bords (il voit x 22 à 378) ; un écran large garde toute
  la largeur et ne retient que la bande y 255 à 505.

  Le plateau, lui, est transparent dans ce thème : le décor se voit au travers.
  Il couvre à peu près y 250 à 590. D'où le partage en trois :

    - y 0 à 250 et y 590 à 760, au centre : le soleil, les nuages, l'herbe,
      les grosses bulles. Vus sur téléphone, hors de l'écran large.
    - y 250 à 590, sur les côtés (x hors de 50 à 350) : poissons, billes,
      bulles. Vus sur écran large, rognés sur téléphone.
    - y 250 à 590, au centre : presque rien, et ce presque rien très pâle.
      C'est là que sont les cases, et elles doivent rester lisibles.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id='verreDoux' x='-60%' y='-60%' width='220%' height='220%'><feGaussianBlur stdDeviation='4'/></filter>
    <filter id='verreMoyen' x='-60%' y='-60%' width='220%' height='220%'><feGaussianBlur stdDeviation='9'/></filter>
    <filter id='verreFort' x='-60%' y='-60%' width='220%' height='220%'><feGaussianBlur stdDeviation='20'/></filter>
    <filter id='verreNet' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='1.4'/></filter>

    <radialGradient id='verreBulle' cx='34%' cy='30%' r='72%'>
      <stop offset='0%' stop-color='#ffffff' stop-opacity='.45'/>
      <stop offset='58%' stop-color='#cdf4ff' stop-opacity='.12'/>
      <stop offset='100%' stop-color='#7fe3ff' stop-opacity='.3'/>
    </radialGradient>

    <linearGradient id='verrePoisson' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#f2feff' stop-opacity='.85'/>
      <stop offset='100%' stop-color='#59cdea' stop-opacity='.55'/>
    </linearGradient>

    <radialGradient id='verreBille' cx='34%' cy='28%' r='78%'>
      <stop offset='0%' stop-color='#e8fdff'/>
      <stop offset='42%' stop-color='#6fd3f2'/>
      <stop offset='100%' stop-color='#0f5e8e'/>
    </radialGradient>
    <linearGradient id='verreVernis' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#ffffff' stop-opacity='.9'/>
      <stop offset='100%' stop-color='#ffffff' stop-opacity='0'/>
    </linearGradient>

    <linearGradient id='verreHerbeFond' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#9bf0a8' stop-opacity='.5'/>
      <stop offset='100%' stop-color='#117a52' stop-opacity='.75'/>
    </linearGradient>
    <linearGradient id='verreHerbeAvant' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#d9ffd0' stop-opacity='.9'/>
      <stop offset='45%' stop-color='#66e08a' stop-opacity='.9'/>
      <stop offset='100%' stop-color='#0d6b48' stop-opacity='.95'/>
    </linearGradient>

    <radialGradient id='verreSoleil' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#ffffff' stop-opacity='.8'/>
      <stop offset='45%' stop-color='#d8f8ff' stop-opacity='.3'/>
      <stop offset='100%' stop-color='#bfeeff' stop-opacity='0'/>
    </radialGradient>
  </defs>
