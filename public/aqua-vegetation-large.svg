Q1488 769 1465.6 802 Q1440 835 1452.8 868 Q1488 901 1459.2 934 Q1440 967 1446.4 1000Z' fill='url(#fond)' opacity='0.5'/></g><g class='o' style='--a:1.88deg;--d:9.51s;--r:-9.62s'><path d='M1632 1000 Q1602 960 1626 920 Q1662 880 1638 840 Q1602 800 1626 760 Q1662 720 1638 680 Q1602 640 1626 600 Q1624 640 1648 680 Q1684 720 1655.6 760 Q1624 800 1639.2 840 Q1684 880 1646.8 920 Q1624 960 1630.4 1000Z' fill='url(#fond)' opacity='0.7'/></g>
