<!--
  La végétation du thème Aqua, format large.

  Elle est dans son propre fichier, et non dans le décor, pour une raison de
  coût : le décor porte des flous gaussiens jusqu'à trente-quatre, et animer
  quoi que ce soit à l'intérieur obligerait à les recalculer en plein écran à
  chaque image. Ici il n'y a aucun flou.

  Le cadrage reprend exactement celui du décor — même boîte, même "slice" —
  pour que les plantes retombent là où elles étaient.

  Le mouvement est un "skewX" autour de la ligne du sol : seule l'inclinaison
  compte pour une plante, et comme ce geste ne décale un point qu'en fonction
  de sa distance au centre, les pieds restent plantés. Une rotation les aurait
  fait glisser.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><style>
    /* Le centre de transformation est la ligne du sol, en unités du dessin.
       Les SVG prennent « view-box » comme boîte de référence par défaut, donc
       une longueur suffit — pas besoin de « transform-box ». */
    .o { transform-origin: 0 1000px; animation: onde var(--d) ease-in-out var(--r) infinite alternate; }
    @keyframes onde { from { transform: skewX(calc(-1 * var(--a))); } to { transform: skewX(var(--a)); } }
    @media (prefers-reduced-motion: reduce) { .o { animation: none; } }
  </style><defs>
    <linearGradient id="fond" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9bf0a8" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#117a52" stop-opacity=".64"/>
    </linearGradient>
    <linearGradient id="avant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9ffd0" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#66e08a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#0d6b48" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <!-- Les algues, une phase chacune -->
