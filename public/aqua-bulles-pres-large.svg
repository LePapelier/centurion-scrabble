<?xml version="1.0" encoding="UTF-8"?>
<!--
  Les bulles du thème Aqua, format large — plan proche.

  Rien ne bouge ici : ce fichier est tramé une fois, et c'est la feuille de
  style qui le fait dériver. Un SVG de fond qui s'anime est retramé en entier
  à chaque image, et trente-quatre bulles animées une par une faisaient tomber
  une image sur dix sur un téléphone au processeur ralenti quatre fois ;
  déplacer un calque déjà tramé ne coûte rien.

  D'où la coupe en deux plans, par rayon : le proche et le lointain dérivent à
  des rythmes différents, et ce décalage suffit à ce qu'on ne lise pas un bloc
  qui glisse, mais de l'eau qui bouge.

  Le cadrage reprend exactement celui du décor — même boîte, même "slice" —
  pour que les bulles retombent là où elles étaient.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><defs>
    <radialGradient id="bulle" cx="34%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="58%" stop-color="#cdf4ff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#7fe3ff" stop-opacity=".3"/>
    </radialGradient>
  </defs>
